# ---------------------------------------------------------------------------
# Gradle / JVM
# ---------------------------------------------------------------------------
# Kotlin's incremental JVM compilation and the Compose compiler both want a
# little headroom; 2 GB is comfortable on a Galaxy A15's termux JDK and on CI.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Parallel module execution and the build cache cut rebuild time.
org.gradle.parallel=true
org.gradle.caching=true

# The configuration cache is deliberately OFF.
#
# It is a pure build-speed optimisation, and kapt's support for it is
# incomplete - the failure mode is a build that breaks during configuration,
# which is the worst possible outcome for a project whose whole point is
# "clone it and run ./gradlew anywhere, including on a phone". Re-enable this
# once the project moves from kapt to KSP (see README, "Why kapt, not KSP?").
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# AndroidX
# ---------------------------------------------------------------------------
android.useAndroidX=true

# No support-library code anywhere in this project, so Jetifier stays off. It
# also keeps Ktor/Netty/Tink class rewriting out of the build.
android.enableJetifier=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Non-final resource IDs speed up Kotlin compilation and are required for the
# Compose compiler's resource inlining.
# ---------------------------------------------------------------------------
android.nonFinalResIds=true
