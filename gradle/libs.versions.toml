# ---------------------------------------------------------------------------
# Version catalog. Every version below was resolved from the official Maven
# metadata for its artifact on 2026-09-15; see README.md -> "Toolchain matrix"
# for the compatibility reasoning (in particular why AGP is pinned to the 8.x
# line rather than 9.x).
# ---------------------------------------------------------------------------

[versions]
# --- Build tooling -------------------------------------------------------
# AGP 8.13.2 is the last 8.x release. It supports up to API level 36.1, needs
# Gradle >= 8.13 and JDK 17. AGP 9.x would require Hilt >= 2.59 and built-in
# Kotlin; see README "Why not AGP 9?" before bumping.
agp = "8.13.2"
kotlin = "2.3.21"

# --- AndroidX ------------------------------------------------------------
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.1"
composeBom = "2026.09.00"

# --- Dependency injection -------------------------------------------------
# 2.58 is the LAST Hilt whose Gradle plugin supports AGP 8.x.
hilt = "2.58"
hiltNavigationCompose = "1.4.0"

# --- Local HTTP server ----------------------------------------------------
# Ktor must be >= 3.3.2: earlier 3.3.x throws java.lang.VerifyError on Android
# (KTOR-8916, a Netty bytecode issue fixed upstream).
ktor = "3.5.2"

# --- Outbound HTTP client -------------------------------------------------
okhttp = "5.5.0"

# --- Crypto / secure storage ---------------------------------------------
tinkAndroid = "1.23.0"
# Deprecated upstream (no further releases planned) but still published as a
# stable 1.1.0. Only used by the opt-in legacy backend.
securityCrypto = "1.1.0"

# --- Testing --------------------------------------------------------------
junit = "4.13.2"
coroutinesTest = "1.10.2"
androidxTestJunit = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# AndroidX core / Compose
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Lifecycle / ViewModel
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Ktor server (loopback proxy)
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }

# OkHttp (upstream calls from the proxy)
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Secure storage
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tinkAndroid" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Declared with an explicit version rather than a bare id() so plugin resolution
# does not depend on the kapt marker being reachable from the kotlin-android
# classpath.
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
